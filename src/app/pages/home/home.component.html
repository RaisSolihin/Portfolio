<section appScrollFade class="py-24 px-6 max-w-4xl mx-auto text-center">
  <h1 class="text-5xl md:text-6xl font-bold tracking-tight text-apple-black dark:text-white mb-4">
    Hi, I'm {{ data.hero.name }}
  </h1>
  <p class="text-xl md:text-2xl font-semibold text-apple-black dark:text-white mb-6">
    {{ data.hero.tagline }}
  </p>
  <p class="text-lg text-apple-gray dark:text-zinc-400 max-w-2xl mx-auto mb-12 leading-relaxed">
    {{ data.hero.shortDescription }}
  </p>
  <div class="flex flex-wrap gap-4 justify-center">
    <a
      [routerLink]="data.hero.primaryCtaLink"
      class="inline-block px-8 py-3.5 rounded-full bg-apple-black dark:bg-white dark:text-apple-black text-white font-semibold text-[15px] hover:scale-[1.02] transition-transform no-underline"
    >
      {{ data.hero.primaryCtaText }}
    </a>
    <a
      [routerLink]="data.hero.secondaryCtaLink"
      class="inline-block px-8 py-3.5 rounded-full border-2 border-apple-black dark:border-white text-apple-black dark:text-white font-semibold text-[15px] hover:scale-[1.02] hover:bg-apple-blue hover:border-apple-blue hover:text-white transition-all no-underline"
    >
      {{ data.hero.secondaryCtaText }}
    </a>
  </div>
</section>

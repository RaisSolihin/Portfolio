# Deploy Angular portfolio to GitHub Pages
# Your site will be at: https://<username>.github.io/<repo-name>/
# Do not use "Deploy static content to Pages" - it deploys repo root and causes 404.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Replace YourRepoName with your actual GitHub repo name (e.g. Portfolio)
      - name: Build for GitHub Pages
        run: npm run build -- --base-href /${{ github.event.repository.name }}/

      - name: Verify build output
        run: |
          ls -la dist/portfolio/browser/
          test -f dist/portfolio/browser/index.html || (echo "Missing index.html" && exit 1)

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portfolio/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

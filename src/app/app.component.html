<div class="min-h-screen flex flex-col bg-white dark:bg-zinc-900">
  <header
    class="sticky top-0 z-50 bg-white/70 dark:bg-zinc-900/70 backdrop-blur-[20px] border-b border-[#d2d2d7] dark:border-zinc-700"
  >
    <nav class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
      <a routerLink="/" class="text-apple-black dark:text-white font-bold text-xl tracking-tight hover:text-apple-blue dark:hover:text-apple-blue transition-colors no-underline">
        MyPortfolio
      </a>
      <div class="flex items-center gap-8">
        <a
          routerLink="/about"
          routerLinkActive="text-apple-blue font-semibold"
          class="text-apple-gray dark:text-zinc-400 hover:text-apple-black dark:hover:text-white transition-colors no-underline text-[15px]"
          >About</a
        >
        <a
          routerLink="/skills"
          routerLinkActive="text-apple-blue font-semibold"
          class="text-apple-gray dark:text-zinc-400 hover:text-apple-black dark:hover:text-white transition-colors no-underline text-[15px]"
          >Skills</a
        >
        <a
          routerLink="/experience"
          routerLinkActive="text-apple-blue font-semibold"
          class="text-apple-gray dark:text-zinc-400 hover:text-apple-black dark:hover:text-white transition-colors no-underline text-[15px]"
          >Experience</a
        >
        <a
          routerLink="/education"
          routerLinkActive="text-apple-blue font-semibold"
          class="text-apple-gray dark:text-zinc-400 hover:text-apple-black dark:hover:text-white transition-colors no-underline text-[15px]"
          >Education</a
        >
        <a
          routerLink="/resume"
          routerLinkActive="text-apple-blue font-semibold"
          class="text-apple-gray dark:text-zinc-400 hover:text-apple-black dark:hover:text-white transition-colors no-underline text-[15px]"
          >Resume</a
        >
        <a
          routerLink="/contact"
          routerLinkActive="text-apple-blue font-semibold"
          class="text-apple-gray dark:text-zinc-400 hover:text-apple-black dark:hover:text-white transition-colors no-underline text-[15px]"
          >Contact</a
        >
        <button
          type="button"
          (click)="theme.toggleTheme()"
          [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
          class="p-2 rounded-lg border border-[#d2d2d7] dark:border-zinc-600 bg-white/50 dark:bg-zinc-800/50 hover:bg-[#f5f5f7] dark:hover:bg-zinc-700 transition-colors text-lg leading-none"
        >
          @if (theme.isDark()) { ☀️ } @else { 🌙 }
        </button>
      </div>
    </nav>
  </header>

  <main class="flex-1">
    <router-outlet></router-outlet>
  </main>

  <footer class="border-t border-[#d2d2d7] dark:border-zinc-700 py-8 text-center text-apple-gray dark:text-zinc-400 text-sm">
    <div class="max-w-5xl mx-auto px-6">
      <p class="m-0">© {{ data.hero.name }} · Built with Angular</p>
    </div>
  </footer>
  </div>
